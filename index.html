<!doctype html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090D0B">
  <title>بانگهێشتنامە · بۆرسەی زەوییەکانی کۆیە</title>
  <meta name="description" content="بانگهێشتنامە بۆ مەراسیمی کردنەوەی فەرمیی بۆرسەی زەوییەکانی کۆیە بە ئەندامبوونی ٢٠ خاوەن نووسینگە.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ckb_IQ">
  <meta property="og:title" content="بانگهێشتنامە · بۆرسەی زەوییەکانی کۆیە">
  <meta property="og:description" content="مەراسیمی کردنەوەی گەورەترین بۆرسە بە ئەندامبوونی ٢٠ خاوەن نووسینگە لە شاری کۆیە — چوارشەممە ٧ی تشرینی یەکەم ٢٠٢٦">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23090D0B'/%3E%3Cpath d='M15 50V27l9-3v26M28 50V17l4-3 4 3v33M40 50V31l9-3v22' fill='none' stroke='%23D4B47C' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Kufi+Arabic:wght@300;400;500;600;700;800&family=Noto+Sans+Arabic:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="is-locked">
  <noscript><style>.cover{display:none}.reveal{opacity:1;transform:none}</style><p class="noscript">تکایە JavaScript چالاک بکە بۆ بینینی بانگهێشتنامەکە.</p></noscript>

  <!-- Language Switcher -->
  <nav class="lang-bar" id="langBar" aria-label="Language selection">
    <button class="lang-btn is-active" type="button" data-lang="ckb" aria-pressed="true">کوردی</button>
    <button class="lang-btn" type="button" data-lang="ar" aria-pressed="false">عربي</button>
    <button class="lang-btn" type="button" data-lang="en" aria-pressed="false">English</button>
  </nav>

  <!-- Icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.1-7-11.4a7 7 0 0 1 14 0C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.6" r="2.4"/></symbol>
    <symbol id="i-bow" viewBox="0 0 24 24"><path d="M3 7.5 10 11v2l-7 3.5zM21 7.5 14 11v2l7 3.5z"/><rect x="10" y="10" width="4" height="4" rx="1.2"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M12 13.2v4.4M9.8 15.4h4.4"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="17.5" cy="5.5" r="2.5"/><circle cx="6.5" cy="12" r="2.5"/><circle cx="17.5" cy="18.5" r="2.5"/><path d="m8.7 10.8 6.6-3.9M8.7 13.2l6.6 3.9"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M19 12H5m5-5-5 5 5 5"/></symbol>
    <symbol id="i-google" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M9 14h2v3M14 14h1.5v3"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m-4.5-4.5L12 15l4.5-4.5M5 19.5h14"/></symbol>
  </svg>

  <div class="ambient" aria-hidden="true"></div>

  <!-- ═════════ Cover: two doors that open onto the invitation ═════════ -->
  <div class="cover" id="cover">
    <div class="door door--left" aria-hidden="true"></div>
    <div class="door door--right" aria-hidden="true"></div>
    <div class="cover__content">
      <svg class="monogram" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="monogram__ring" cx="60" cy="60" r="57"/>
        <circle class="monogram__ring monogram__ring--dash" cx="60" cy="60" r="50"/>
        <path class="monogram__towers" d="M38 82V52l11-4v34M54 82V36l6-5 6 5v46M71 82V56l11-3v29M30 82h60"/>
      </svg>
      <p class="cover__eyebrow" data-text="ui.coverEyebrow">بانگهێشتنامەیەکی تایبەت</p>
      <p class="cover__for" data-text="ui.coverFor">بۆ</p>
      <p class="cover__guest" data-text="view.coverGuest"></p>
      <button class="btn btn--gold" id="openInvite" type="button" data-text="ui.coverBtn">
        کردنەوەی بانگهێشتنامە
      </button>
    </div>
  </div>

  <!-- ═════════ Invitation ═════════ -->
  <main class="invite" id="invite" inert>
    <header class="hero">
      <svg class="skyline" viewBox="0 0 320 200" role="img" aria-label="بۆرسەی زەوییەکانی کۆیە">
        <defs>
          <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#F6E6BE"/>
            <stop offset=".55" stop-color="#D4B47C"/>
            <stop offset="1" stop-color="#9C7942"/>
          </linearGradient>
          <radialGradient id="g-sun">
            <stop offset="0" stop-color="#E9C987" stop-opacity=".42"/>
            <stop offset=".55" stop-color="#E9C987" stop-opacity=".1"/>
            <stop offset="1" stop-color="#E9C987" stop-opacity="0"/>
          </radialGradient>
          <pattern id="p-floors" width="6" height="8" patternUnits="userSpaceOnUse">
            <path d="M0 7.5h6" stroke="#D4B47C" stroke-opacity=".32" stroke-width=".6"/>
          </pattern>
        </defs>

        <circle class="sky-glow" cx="160" cy="110" r="104" fill="url(#g-sun)"/>
        <path class="draw" style="--d:.1s" d="M104 110a56 56 0 1 0 112 0a56 56 0 1 0-112 0" pathLength="1" stroke="url(#g-gold)" stroke-width=".7" stroke-opacity=".7"/>

        <g class="stars">
          <circle cx="42" cy="38" r=".9"/><circle cx="78" cy="22" r=".7"/><circle cx="252" cy="30" r="1"/>
          <circle cx="286" cy="62" r=".7"/><circle cx="30" cy="92" r=".6"/><circle cx="226" cy="14" r=".6"/>
          <circle cx="112" cy="40" r=".6"/><circle cx="300" cy="104" r=".8"/>
        </g>

        <!-- solid silhouettes hide the sun behind the towers -->
        <g class="towers-solid">
          <path d="M92 184V84l38-14v114zM138 184V44l23-18 23 18v140zM192 184V98l36-10v96z"/>
        </g>
        <g class="towers" stroke="url(#g-gold)" stroke-width="1.1" stroke-linejoin="round">
          <path class="facade" style="--d:.9s" d="M92 184V84l38-14v114zM138 184V44l23-18 23 18v140zM192 184V98l36-10v96z" fill="url(#p-floors)" stroke="none"/>
          <path class="draw" style="--d:.35s" d="M92 184V84l38-14v114" pathLength="1"/>
          <path class="draw" style="--d:.2s" d="M138 184V44l23-18 23 18v140" pathLength="1"/>
          <path class="draw" style="--d:.5s" d="M192 184V98l36-10v96" pathLength="1"/>
          <path class="draw" style="--d:1s" d="M161 26V10M111 78v106M161 32v152M210 94v90" pathLength="1" stroke-width=".6" stroke-opacity=".7"/>
        </g>

        <g class="trees" stroke="url(#g-gold)" stroke-width=".8">
          <path class="draw" style="--d:1.2s" d="M62 184v-6M57 173a5 5 0 1 0 10 0a5 5 0 1 0-10 0M74 184v-4M70.4 176.4a3.6 3.6 0 1 0 7.2 0a3.6 3.6 0 1 0-7.2 0M250 184v-6M245 173a5 5 0 1 0 10 0a5 5 0 1 0-10 0M262 184v-4M258.4 176.4a3.6 3.6 0 1 0 7.2 0a3.6 3.6 0 1 0-7.2 0" pathLength="1"/>
        </g>
        <path class="draw" style="--d:0s" d="M14 184h292" pathLength="1" stroke="url(#g-gold)" stroke-width=".9"/>
      </svg>

      <p class="hero__eyebrow" data-text="event.title"></p>
      <h1 class="hero__title" id="title" tabindex="-1"><span class="gold-text" data-text="project.name"></span></h1>
      <p class="hero__latin" dir="ltr" data-text="project.latinName"></p>
      <p class="hero__tagline" data-text="project.tagline"></p>
    </header>

    <section class="panel letter reveal" aria-label="نامەی بانگهێشت">
      <p class="letter__greeting" data-text="view.salutation"></p>
      <p class="letter__body" data-text="event.message"></p>
      <p class="letter__sign" data-text="view.signature"></p>
    </section>

    <section class="panel when reveal" aria-labelledby="when-title">
      <h2 class="section-title" id="when-title" data-text="ui.detailsTitle">وردەکاری مەراسیم</h2>

      <div class="date-lockup">
        <span class="date-lockup__side" data-text="view.weekday"></span>
        <span class="date-lockup__day gold-text" data-text="view.day"></span>
        <span class="date-lockup__side" data-text="view.month"></span>
        <span class="date-lockup__year" data-text="view.year"></span>
      </div>

      <ul class="details">
        <li class="detail">
          <span class="detail__icon"><svg class="icon"><use href="#i-clock"/></svg></span>
          <div class="detail__body">
            <span class="detail__label" data-text="ui.timeLabel">کات</span>
            <span class="detail__value" data-text="view.timeRange"></span>
          </div>
        </li>
        <li class="detail">
          <span class="detail__icon"><svg class="icon"><use href="#i-pin"/></svg></span>
          <div class="detail__body">
            <span class="detail__label" data-text="ui.venueLabel">شوێن</span>
            <span class="detail__value" data-text="venue.name"></span>
            <span class="detail__sub" data-text="venue.address"></span>
            <a class="detail__link" id="venueMapLink" target="_blank" rel="noopener">
              <span data-text="ui.mapBtn">بینینی نەخشە</span> <svg class="icon icon--sm"><use href="#i-arrow"/></svg>
            </a>
          </div>
        </li>
        <li class="detail">
          <span class="detail__icon"><svg class="icon"><use href="#i-bow"/></svg></span>
          <div class="detail__body">
            <span class="detail__label" data-text="ui.dressLabel">جلوبەرگ</span>
            <span class="detail__value" data-text="event.dressCode"></span>
          </div>
        </li>
      </ul>
    </section>

    <section class="panel countdown reveal" aria-labelledby="countdown-title">
      <h2 class="section-title" id="countdown-title" data-text="ui.countdownTitle">تا مەراسیم ماوە</h2>
      <div class="countdown__grid" id="countdown">
        <div class="countdown__unit"><span class="countdown__num" data-unit="days">٠٠</span><span class="countdown__label" data-text="ui.days">ڕۆژ</span></div>
        <div class="countdown__unit"><span class="countdown__num" data-unit="hours">٠٠</span><span class="countdown__label" data-text="ui.hours">کاتژمێر</span></div>
        <div class="countdown__unit"><span class="countdown__num" data-unit="minutes">٠٠</span><span class="countdown__label" data-text="ui.minutes">خولەک</span></div>
        <div class="countdown__unit"><span class="countdown__num" data-unit="seconds">٠٠</span><span class="countdown__label" data-text="ui.seconds">چرکە</span></div>
      </div>
      <p class="countdown__status" id="countdownStatus" hidden></p>
    </section>

    <section class="stats reveal" aria-label="پرۆژە بە ژمارە" id="stats"></section>
    <template id="tpl-stat">
      <div class="stat">
        <span class="stat__value gold-text"><span class="stat__num">٠</span><span class="stat__suffix"></span></span>
        <span class="stat__label"></span>
      </div>
    </template>

    <nav class="actions reveal" aria-label="کردارەکان">
      <button class="action" id="btnCalendar" type="button">
        <svg class="icon"><use href="#i-cal"/></svg><span data-text="ui.calBtn">ساڵنامە</span>
      </button>
      <a class="action" id="actionMapLink" target="_blank" rel="noopener">
        <svg class="icon"><use href="#i-pin"/></svg><span data-text="ui.mapNavBtn">نەخشە</span>
      </a>
      <button class="action" id="btnShare" type="button">
        <svg class="icon"><use href="#i-share"/></svg><span data-text="ui.shareBtn">هاوبەشکردن</span>
      </button>
    </nav>

    <footer class="footer reveal">
      <span class="ornament" aria-hidden="true"></span>
      <p class="footer__hope" data-text="ui.footerHope">بە هیوای بینینتان</p>
      <p class="footer__host" data-text="project.host"></p>
      <p class="footer__credit" data-text="ui.footerCredit">دروستکراوە لەلایەن ڕاند زانا</p>
    </footer>
  </main>

  <dialog class="sheet" id="calDialog" aria-labelledby="cal-title">
    <form method="dialog">
      <h2 class="section-title" id="cal-title" data-text="ui.calTitle">زیادکردن بۆ ساڵنامە</h2>
      <div class="sheet__options">
        <a class="sheet__option" id="calGoogle" target="_blank" rel="noopener">
          <svg class="icon"><use href="#i-google"/></svg><span data-text="ui.calGoogle">ساڵنامەی گووگڵ</span>
        </a>
        <button class="sheet__option" id="calIcs" type="button">
          <svg class="icon"><use href="#i-download"/></svg><span data-text="ui.calIcs">ئەپڵ، ئاوتلووک و هی تر</span>
        </button>
      </div>
      <button class="btn btn--ghost btn--block" value="close" data-text="ui.calClose">داخستن</button>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
